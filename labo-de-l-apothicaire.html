const EAU=[['Distillée',2,'4 pc'],['Égouts',0,'1 pc'],['Élémentaire',2,'4 pc'],['Marais',0,'1 pc'],['Potable',1,'2 pc'],['Sacrée',3,'25 po'],['Sale',0,'1 pc'],['Source',1,'2 pc']];
const MED=[['Armoise de Michaux',0],['Écailles de naga corrupteur',1],['Indigo',2],['Pézize écarlate',0],['Plumes de couatl',0],['Poussière de divinité',3],['Sang de troll',1],['Sang planétaire',2]];
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const sg=n=>(n>0?'+':'')+n;
let st={env:Object.keys(D.E)[0],rank:-1,forb:false,cur:null,pick:{}};
try{st.env=localStorage.getItem('apo-env')||st.env}catch(e){}
$('env').innerHTML=Object.keys(D.E).map(e=>`<option ${e==st.env?'selected':''}>${e}</option>`).join('');
$('env').onchange=e=>{st.env=e.target.value;st.pick={};try{localStorage.setItem('apo-env',st.env)}catch(x){}work()};
$('forb').onchange=e=>{st.forb=e.target.checked;list()};
function ranks(){$('ranks').innerHTML=['Tous',...RK].map((r,i)=>`<button class="chip ${st.rank==i-1?'on':''}" data-r="${i-1}">${r}</button>`).join(' ');
document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{st.rank=+b.dataset.r;ranks();list()})}
function list(){const rs=D.R.filter(r=>(st.rank<0||r.r==st.rank)&&(st.forb||!r.f));
$('list').innerHTML=rs.map(r=>`<div class="card rec ${st.cur&&st.cur.n==r.n?'sel':''}" data-n="${esc(r.n)}"><div><b>${esc(r.n)}</b><br><small>${RK[r.r]}${r.sp?'':' · commune'} · ${r.h} h · ${r.v}</small></div><div>${r.f?`<span class="tag">${r.f}</span> `:''}<span class="tag">DD ${r.dd||'?'}</span></div></div>`).join('')||'<p class="m">Aucune recette.</p>';
document.querySelectorAll('.rec').forEach(c=>c.onclick=()=>{st.cur=D.R.find(r=>r.n==c.dataset.n);st.pick={};list();work()})}
function opts(slot){const t=slot[0].toLowerCase(),env=D.E[st.env].filter(x=>x[1].includes(t)).map(x=>({n:x[0],q:x[2],src:'env',x:`DD ${QDD[x[2]]} · 5 (1d10) ${QV[x[2]]}`}));
let gen=[];if(t=='eau')gen=EAU.map(x=>({n:'Eau '+x[0].toLowerCase(),q:x[1],src:'achat',x:x[2]}));if(t=='médicinal')gen=MED.map(x=>({n:x[0],q:x[1],src:'exemple',x:'hors cueillette de la zone'}));
return{env,gen,t}}
function work(){const r=st.cur;if(!r)return;let tot=0,minq=9,miss=0,h=`<div class="card"><b>${esc(r.n)}</b> <span class="tag">${RK[r.r]}</span><br><span class="m">Outils : ${esc(r.o)} · Propriétés : ${esc(r.p)||'—'}</span></div>`;
r.i.forEach((s,k)=>{const o=opts(s),sub=D.R.find(x=>x.n.toLowerCase()==s[0].toLowerCase());
h+=`<div class="card"><b>${k+1}. ${esc(s[0])}</b>${s[1]?` — ${esc(s[1])}`:''} <span class="m">${esc(s[2])}</span>`;
if(sub)h+=`<br><span class="m">À fabriquer d'abord : </span><a data-sub="${esc(sub.n)}">${esc(sub.n)}</a> (${RK[sub.r]}, ${sub.h} h)`;
else if(!o.env.length&&!o.gen.length)h+=`<br><span class="m">Non listé dans les tables de cueillette : achat, créature ou autre source (voir le MJ).</span>`;
if(s[1]&&!sub)h+=`<br><span class="m">Précision de la recette : ${esc(s[1])} — à valider avec le MJ.</span>`;
const line=(x,i,g)=>`<label class="opt"><input type="radio" name="s${k}" data-k="${k}" data-g="${g}" data-i="${i}" ${st.pick[k]&&st.pick[k].g==g&&st.pick[k].i==i?'checked':''}> <span><span class="q q${x.q}">${QN[x.q]}</span> ${esc(x.n)} <span class="m">· ${x.x} · mod. ${sg(QM[x.q])}</span></span></label>`;
h+=`<div><div class="m">${st.env} :</div>${o.env.map((x,i)=>line(x,i,'e')).join('')||'<div class="m">Rien de ce type ici.</div>'}</div>`;
if(o.gen.length)h+=`<details><summary>Autres sources (${o.t=='eau'?'achat':'exemples du guide'})</summary>${o.gen.map((x,i)=>line(x,i,'g')).join('')}</details>`;
h+='</div>';const p=st.pick[k];if(p){const x=(p.g=='e'?o.env:o.gen)[p.i];if(x){tot+=QM[x.q];minq=Math.min(minq,x.q)}}else if(!sub)miss++});
const dd=r.dd?r.dd+tot:null;
h+=`<div class="card res"><b>Résultat</b><br>Test de ${r.s=='Int'?'Intelligence':'Sagesse'} (ou Intelligence : adaptabilité mentale) : <b>DD ${dd??'?'}</b> <span class="m">(base ${r.dd||'?'} ${sg(tot)} qualité des ingrédients)</span><br>Qualité de la potion : ${minq<9?`<span class="q q${minq}">${QN[minq]}</span>`:'—'} · Durée : ${r.h} h (≈ ${Math.ceil(r.h/8)} jours à 8 h) · Valeur : ${r.v}${miss?`<br><span class="m">${miss} ingrédient(s) à choisir.</span>`:''}<br><button class="go" id="sv">Enregistrer</button></div>`;
$('work').innerHTML=h;
$('work').querySelectorAll('input[type=radio]').forEach(i=>i.onchange=()=>{st.pick[i.dataset.k]={g:i.dataset.g,i:+i.dataset.i};work()});
$('work').querySelectorAll('[data-sub]').forEach(a=>a.onclick=()=>{st.cur=D.R.find(x=>x.n==a.dataset.sub);st.pick={};list();work();scrollTo(0,0)});
$('sv').onclick=()=>{const L=ld();L.push({n:r.n,env:st.env,dd,q:minq<9?QN[minq]:'',t:Date.now()});try{localStorage.setItem('apo-saves',JSON.stringify(L))}catch(e){}sv()}}
function ld(){try{return JSON.parse(localStorage.getItem('apo-saves')||'[]')}catch(e){return[]}}
function sv(){const L=ld();$('saves').innerHTML=L.map((x,i)=>`<div class="card"><button class="x" data-d="${i}">×</button><b>${esc(x.n)}</b><br><span class="m">${x.env}${x.q?' · '+x.q:''}${x.dd?' · DD '+x.dd:''}</span></div>`).join('')||'<p class="m">Aucune pour l\'instant.</p>';
document.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{const L=ld();L.splice(+b.dataset.d,1);try{localStorage.setItem('apo-saves',JSON.stringify(L))}catch(e){}sv()})}
ranks();list();sv();
</script></body></html>
